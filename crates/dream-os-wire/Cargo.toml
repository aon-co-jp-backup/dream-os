[package]
name = "dream-os-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DreamOS/World Laboratory向け通信・永続化層: open-web-server-wire(4層防御通信+4重伝送路)・open-web-server-ledger(4重DB永続化)を再利用したワーカー↔コーディネータ間のセキュア結果送信"

[dependencies]
open-web-server-wire = { path = "../../../open-web-server/crates/open-web-server-wire" }
open-web-server-core = { path = "../../../open-web-server/crates/open-web-server-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
